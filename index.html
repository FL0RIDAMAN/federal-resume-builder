<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Federal Resume Builder</title>
<meta name="description" content="Answer simple questions and get a two-page USAJOBS federal resume as a PDF, checked against the current rules.">
<meta property="og:title" content="Federal Resume Builder">
<meta property="og:description" content="Answer simple questions and get a two-page USAJOBS federal resume as a PDF, checked against the current rules.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%84%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F8; --surface:#FFFFFF; --field:#FFFFFF; --ink:#14213D; --ink-2:#4B5A75;
  --rule:#CFD7E3; --rule-2:#E5E9F0; --signal:#2A55C4; --signal-ink:#FFFFFF; --signal-soft:#E8EEFB;
  --go:#1B7449; --go-soft:#E1F2E8; --hold:#AD4511; --hold-soft:#FBE9DD; --note:#7E5B00; --note-soft:#FAF0D4;
  --shadow:0 1px 2px rgba(20,33,61,.10),0 10px 28px rgba(20,33,61,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1422; --surface:#132037; --field:#0F1A2D; --ink:#E4EAF4; --ink-2:#9CADC8;
    --rule:#2A3955; --rule-2:#1C2942; --signal:#82A5FF; --signal-ink:#0C1422; --signal-soft:#1A2948;
    --go:#56C893; --go-soft:#11301F; --hold:#FF9B5E; --hold-soft:#3A2113; --note:#E8C25A; --note-soft:#33290E;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1422; --surface:#132037; --field:#0F1A2D; --ink:#E4EAF4; --ink-2:#9CADC8;
  --rule:#2A3955; --rule-2:#1C2942; --signal:#82A5FF; --signal-ink:#0C1422; --signal-soft:#1A2948;
  --go:#56C893; --go-soft:#11301F; --hold:#FF9B5E; --hold-soft:#3A2113; --note:#E8C25A; --note-soft:#33290E;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Masthead */
.masthead{max-width:1280px;margin:0 auto;padding:28px 24px 10px;display:flex;gap:12px 24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.masthead h1{margin:0;font-size:clamp(1.55rem,1.1rem + 1.6vw,2.15rem);font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.masthead p{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.savestate{font-size:.875rem;color:var(--ink-2);margin:0}
.savestate.warn{color:var(--hold);font-weight:600}

/* Step rail */
.rail{max-width:1280px;margin:0 auto;padding:6px 24px 18px;overflow-x:auto;scrollbar-width:thin}
.rail ol{list-style:none;margin:0;padding:0;display:flex;gap:2px;min-width:max-content;border-bottom:1px solid var(--rule)}
.rail button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:10px 12px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:.9375rem;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.rail button:hover{color:var(--ink)}
.rail button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--signal);font-weight:650}
.rail .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font-size:.8125rem;font-weight:700;font-variant-numeric:tabular-nums}
.rail .done .num{background:var(--go);border-color:var(--go);color:var(--surface)}

/* Layout */
.layout{max-width:1280px;margin:0 auto;padding:4px 24px 120px;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,470px);gap:44px;align-items:start}
.formcol{min-width:0;max-width:680px}
.previewcol{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px - env(safe-area-inset-top,0px));overflow:auto;padding:4px 8px 24px}

/* Step content */
.step h2{font-size:1.6rem;font-weight:800;letter-spacing:-0.015em;line-height:1.2}
.step h3{font-size:1.125rem;font-weight:700;margin:28px 0 10px}
.lede{color:var(--ink-2);margin:6px 0 26px;max-width:62ch}
.field{margin:0 0 20px;min-width:0}
.field>label,.q{display:block;font-weight:600;margin:0 0 4px}
.hint{margin:0 0 8px;color:var(--ink-2);font-size:.875rem;max-width:62ch}
.hint.good{color:var(--go);font-weight:600}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--field);font-size:16px;line-height:1.4;min-height:44px}
textarea{resize:vertical;min-height:84px;display:block}
select{appearance:auto;min-width:0;max-width:100%}
.entries>*{min-width:0}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.7}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:0 12px}
.row>*{min-width:0}
.row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:8px}
.row3 label{display:block;font-size:.8125rem;color:var(--ink-2);margin-bottom:2px}
.narrow{max-width:220px}
.check{display:flex;gap:10px;align-items:center;font-weight:500;margin:-6px 0 20px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--signal);flex:none}
fieldset.fs{border:0;padding:0;margin:0 0 20px;min-width:0}
fieldset.fs legend{padding:0;float:left;width:100%}
fieldset.fs legend + *{clear:both}
fieldset[disabled]{opacity:.5}
.my{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px;clear:both}
.count{margin:-12px 0 20px;font-size:.875rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--signal);padding:12px 16px;background:var(--surface);border-radius:0 8px 8px 0;margin:4px 0 24px;font-size:.9375rem;max-width:62ch}
.note strong{display:block;margin-bottom:2px}
.printas{margin:-10px 0 22px;font-size:.875rem;color:var(--ink-2);padding:8px 12px;border-radius:8px;background:var(--rule-2);max-width:62ch}
.printas b{color:var(--ink);font-weight:650}
.printas:empty{display:none}
.fs .printas{margin-top:12px}
.docs{margin:-12px 0 14px}
.fs .check{margin:0 0 10px}
.headprev{margin:30px 0 24px}
.headprev-box{background:#fff;color:#000;border:1px solid var(--rule);border-radius:4px;padding:16px 18px;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.45;box-shadow:var(--shadow);overflow-wrap:anywhere}
.headprev-box b{display:block;font-size:17px;margin-bottom:2px}
.headprev-box span{display:block}

/* Entries */
.entries{display:flex;flex-direction:column;gap:12px;margin:0 0 16px}
.entry{background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.entry>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;border-radius:10px}
.entry>summary::-webkit-details-marker{display:none}
.entry-num{width:28px;height:28px;border-radius:6px;background:var(--rule-2);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9375rem}
.entry-title{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-title small{display:block;font-weight:400;color:var(--ink-2);font-size:.875rem;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:.8125rem;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap;color:var(--ink-2)}
.tag.go{background:var(--go-soft);color:var(--go)}
.tag.hold{background:var(--hold-soft);color:var(--hold)}
.entry-body{padding:18px 16px 16px;border-top:1px solid var(--rule-2)}
.entry.flat{padding:16px 16px 4px}
.entry-tools{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--rule-2);padding-top:14px;margin-top:6px}
.entry.flat .entry-tools{border:0;padding-top:0;margin:-6px 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.kindhint{margin:-12px 0 20px}
details.optional{margin:0 0 20px;border:1px dashed var(--rule);border-radius:8px;padding:10px 14px}
details.optional>summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
details.optional[open]>summary{margin-bottom:14px}

/* Bullets */
.prompts{margin:0 0 14px;padding:12px 16px 12px 34px;background:var(--signal-soft);border-radius:8px;font-size:.9375rem}
.prompts li{margin:3px 0}
.bullet-row{display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px 8px;margin-bottom:10px}
.bullet-mark{padding-top:10px;color:var(--ink-2);font-weight:800;line-height:1.4}
.bullet-row textarea{min-height:68px}
.bullet-tools{grid-column:2;justify-self:end;display:flex;gap:6px}
.iconbtn{width:36px;height:34px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-size:1rem;line-height:1;display:inline-grid;place-items:center}
.iconbtn:hover:not([disabled]){background:var(--rule-2)}
.iconbtn[disabled]{opacity:.35;cursor:default}
details.builder{margin:6px 0 0;border-top:1px solid var(--rule-2);padding-top:12px}
details.builder>summary{cursor:pointer;font-weight:600;color:var(--signal)}
details.builder[open]>summary{margin-bottom:10px}
.builder .field{margin-bottom:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 16px;font-weight:650;border:1px solid transparent;cursor:pointer;min-height:44px;text-decoration:none;background:none}
.btn.primary{background:var(--signal);color:var(--signal-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.quiet{border-color:var(--rule);background:var(--surface)}
.btn.quiet:hover{background:var(--rule-2)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9375rem}
.btn.danger{color:var(--hold)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--signal);font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;gap:2px;padding:4px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-size:.875rem;line-height:1.4}
.chip.used{background:var(--go-soft);border-color:transparent;color:var(--go)}
.chip.used::before{content:"✓";margin-right:4px;font-weight:700}
.chip button{border:0;background:none;cursor:pointer;width:22px;height:22px;margin:-2px -6px -2px 2px;border-radius:50%;color:inherit;opacity:.7;font-size:1rem;line-height:1}
.chip button:hover{opacity:1;background:var(--rule-2)}
.chips .empty{color:var(--ink-2);font-size:.875rem}
.kwadd{display:flex;gap:8px;max-width:420px}
.kwbar{margin:0 0 22px;padding:14px 16px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.kwbar .q{font-size:.9375rem}
.kwbar .chips{margin-bottom:0}
.kwbar .hint{margin:0}

/* Go / No-go */
.verdict{border-radius:12px;padding:22px 24px;margin:0 0 26px}
.verdict.go{background:var(--go-soft)}
.verdict.hold{background:var(--hold-soft)}
.verdict .call{font-size:3rem;font-weight:800;letter-spacing:.03em;line-height:1}
.verdict.go .call{color:var(--go)}
.verdict.hold .call{color:var(--hold)}
.verdict p{margin:10px 0 0;font-size:1.0625rem}
.poll{list-style:none;margin:0 0 10px;padding:0}
.poll-row{display:grid;grid-template-columns:auto minmax(24px,1fr) auto;align-items:baseline;gap:0 10px;padding:11px 0;border-bottom:1px solid var(--rule-2)}
.poll-label{font-weight:600}
.poll-leader{border-bottom:2px dotted var(--rule);transform:translateY(-4px)}
.poll-call{font-weight:800;letter-spacing:.07em;font-size:.9375rem}
.is-go .poll-call{color:var(--go)}
.is-hold .poll-call{color:var(--hold)}
.is-note .poll-call{color:var(--note)}
.poll-detail{grid-column:1/-1;margin:6px 0 0;padding-left:20px;color:var(--ink-2);font-size:.9375rem}
.poll-detail li{margin:2px 0}
.poll-fix{grid-column:1/-1;justify-self:start;margin-top:4px}
.block{margin:30px 0 0;padding-top:4px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
details.section{border-top:1px solid var(--rule);margin-top:30px;padding:16px 0 0}
details.section>summary{font-weight:700;font-size:1.125rem;cursor:pointer}
details.section[open]>summary{margin-bottom:10px}
.copyblock{margin:14px 0}
.copyhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:600}
.copyblock textarea{font-size:.875rem;min-height:130px}
.fix{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--surface)}
.fix p{margin:0 0 8px}
.fix del{color:var(--ink-2);text-decoration-color:var(--hold);text-decoration-thickness:2px}
.fix ins{text-decoration:none;background:var(--go-soft);color:var(--go);font-weight:600;border-radius:3px;padding:0 2px}
.fix .why{font-size:.875rem;color:var(--ink-2)}
.list{margin:6px 0 0;padding-left:20px;max-width:62ch}
.list li{margin:4px 0}

/* Preview */
.meter{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.9375rem}
.meter-top strong{font-variant-numeric:tabular-nums}
.meter.over .meter-top strong{color:var(--hold)}
.meter-bar{position:relative;height:8px;border-radius:4px;background:var(--rule-2);margin-top:8px;overflow:hidden}
.meter-bar span{position:absolute;top:0;bottom:0;left:0;background:var(--go);border-radius:4px}
.meter.over .meter-bar span{background:var(--hold)}
.meter-bar i{position:absolute;top:0;bottom:0;width:2px;left:50%;background:var(--surface)}
.meter small{display:block;color:var(--ink-2);font-size:.8125rem;margin-top:6px}
.page{background:#fff;box-shadow:var(--shadow);margin:0 0 14px;border-radius:2px}
.page svg{display:block;width:100%;height:auto}
.page.over{outline:3px solid var(--hold);outline-offset:3px}
.page-label{font-size:.8125rem;color:var(--ink-2);margin:0 0 6px;font-variant-numeric:tabular-nums}
.page-label.over{color:var(--hold);font-weight:700}
.loading{color:var(--ink-2)}

/* Mobile */
.mobilebar{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:550;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:20;text-align:center}
.toast.show{opacity:1}
@media (max-width:959px){
  .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .previewcol{display:none;position:static;max-height:none;overflow:visible;padding:0}
  body.show-preview .previewcol{display:block}
  body.show-preview .formcol{display:none}
  .mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--rule);z-index:10}
  .mobilebar .btn{flex:1}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:520px){
  .masthead{padding:20px 16px 8px}
  .rail{padding:6px 16px 14px}
  .layout{padding-left:16px;padding-right:16px}
  .entry-body{padding:16px 12px 14px}
  .entry>summary{padding:12px}
  .row3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="masthead">
  <div>
    <h1>Federal resume builder</h1>
    <p>Answer the questions and it formats a two-page USAJOBS resume, checks it against the rules, and gives you a PDF.</p>
  </div>
  <p class="savestate" id="savestate" aria-live="polite"></p>
</header>
<nav class="rail" aria-label="Steps"><ol id="rail"></ol></nav>
<main class="layout">
  <section class="formcol" id="form"></section>
  <aside class="previewcol" id="previewcol" aria-label="Resume preview">
    <div class="meter" id="meter"></div>
    <div id="pages"><p class="loading">Loading preview…</p></div>
  </aside>
</main>
<div class="mobilebar"><button type="button" class="btn quiet" data-act="togglePreview" id="previewToggle">Show preview</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- basics ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const KEY = 'fedresume:v1';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const NOW = new Date();
const NOW_YM = NOW.getFullYear() * 12 + NOW.getMonth();
const YEARS = []; for (let y = NOW.getFullYear() + 6; y >= NOW.getFullYear() - 60; y--) YEARS.push(String(y));
const ym = (m, y) => (+y) * 12 + (+m - 1);
const STEPS = [
  {label:'The job'}, {label:'Contact'}, {label:'Summary'}, {label:'Experience'},
  {label:'Education'}, {label:'Certifications'}, {label:'Skills and extras'}, {label:'Go / No-go'}
];
const REVIEW = 7;
const US_STATES = [['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['DC','District of Columbia'],['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming'],['PR','Puerto Rico'],['GU','Guam'],['VI','U.S. Virgin Islands'],['AS','American Samoa'],['MP','Northern Mariana Islands']];
const STATE_OPTS = [['','Choose']].concat(US_STATES.map(x => [x[0], x[1]]), [['INTL','Outside the U.S. (put the country in City)']]);
const stateOut = v => v === 'INTL' ? '' : v;
function toStateCode(v){ v = String(v || '').trim(); if (!v) return ''; const u = v.toUpperCase().replace(/\./g, ''); const hit = US_STATES.find(x => x[0] === u || x[1].toUpperCase() === u); return hit ? hit[0] : v; }
const VET = {
  tp:{label:'5-point: veteran with no service-connected disability rating', print:'5-point (TP)', docs:'DD-214 (Member 4 copy) showing your dates of service and an honorable discharge.'},
  cps:{label:'10-point: service-connected disability rated 30% or more', print:'10-point (CPS)', docs:'DD-214, an SF-15, and your VA disability rating letter.'},
  cp:{label:'10-point: service-connected disability rated 10% to 29%', print:'10-point (CP)', docs:'DD-214, an SF-15, and your VA disability rating letter.'},
  xp:{label:'10-point: disability rated under 10%, or Purple Heart', print:'10-point (XP)', docs:'DD-214, an SF-15, and your VA letter or Purple Heart documentation.'},
  xpd:{label:'10-point derived: spouse, widow or widower, or mother of a veteran', print:'10-point derived (XP)', docs:'An SF-15, the veteran\u2019s DD-214, and the other documents the SF-15 lists for your situation.'},

function merge(def, src){
  if (Array.isArray(def)) return Array.isArray(src) ? src : def;
  if (def && typeof def === 'object'){
    const out = {};
    for (const k of Object.keys(def)) out[k] = (src && typeof src === 'object' && k in src) ? merge(def[k], src[k]) : def[k];
    return out;
  }
  if (typeof def === 'string' && typeof src === 'number') return String(src);
  return (src === undefined || src === null || typeof src !== typeof def) ? def : src;
}
function normalize(o){
  const s = merge(blankState(), o);
  const strs = a => a.filter(x => typeof x === 'string');
  s.jobs = s.jobs.filter(x => x && typeof x === 'object').map(j => {
    const m = merge(blankJob(), j);
    m.bullets = Array.isArray(m.bullets) ? m.bullets.map(b => String(b == null ? '' : b)) : [''];
    if (!m.bullets.length) m.bullets = [''];
    return m;
  });
  if (!s.jobs.length) s.jobs = [blankJob()];
  s.edu = s.edu.filter(x => x && typeof x === 'object').map(e => merge(blankEdu(), e));
  s.certs = s.certs.filter(x => x && typeof x === 'object').map(e => merge(blankCert(), e));
  s.training = s.training.filter(x => x && typeof x === 'object').map(e => merge(blankTrain(), e));
  s.target.kwAdded = strs(s.target.kwAdded);
  s.target.kwRemoved = strs(s.target.kwRemoved);
  s.langs = s.langs.filter(x => x && typeof x === 'object').map(l => merge(blankLang(), l));
  if (!s.langs.length && s.languages.trim()) s.langs = s.languages.split(/\n+/).map(x => x.trim()).filter(Boolean).map(x => Object.assign(blankLang(), {name:x}));
  s.languages = '';
  const c = s.contact;
  if (!c.vetCode && c.vet.trim()) c.vetCode = 'legacy';
  if (c.vetCode && c.vetCode !== 'legacy' && !VET[c.vetCode]) c.vetCode = '';
  if (!c.clLevel && c.clearance.trim()) c.clLevel = 'other';
  c.state = toStateCode(c.state);
  s.jobs.forEach(j => {
    j.state = toStateCode(j.state);
    const pp = j.payPlan.trim();
    if (pp && pp !== 'other'){ const up = pp.toUpperCase(); if (PAY_PLANS.some(x => x[0] === up)) j.payPlan = up; else { j.payPlanOther = up; j.payPlan = 'other'; } }
  });
  s.edu.forEach(e => {
    e.state = toStateCode(e.state);
    if (!e.degreeSel && e.degree.trim()){ const d = DEGREES.find(x => x.toLowerCase() === e.degree.trim().toLowerCase()); if (d){ e.degreeSel = d; e.degree = ''; } else e.degreeSel = 'other'; }
  });
  if (!(s.step >= 0 && s.step < STEPS.length)) s.step = 0;
  return s;
}

const WIN = new Set('€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ');
const MAP = {'\u2010':'-','\u2011':'-','\u2012':'-','\u2015':'—','\u2212':'-','\u2264':'<=','\u2265':'>=','\u2192':'->','\u2190':'<-','\u00A0':' ','\u2009':' ','\u202F':' ','\u2007':' ','\u2002':' ','\u2003':' ','\u200B':'','\u200C':'','\u200D':'','\uFEFF':'','\uFE0F':'','\uFE0E':'','\u25CF':'•','\u25AA':'•','\u2023':'•','\u2043':'-','\u2044':'/','\u2032':"'",'\u2033':'"'};
function clean(s, bad){
  s = String(s == null ? '' : s).normalize('NFC').replace(/[\r\n\t]+/g, ' ');
  let out = '';
  for (const ch of s){
    if (MAP[ch] !== undefined){ out += MAP[ch]; continue; }
    const code = ch.codePointAt(0);
    if ((code >= 0x20 && code <= 0x7E) || (code >= 0xA0 && code <= 0xFF) || WIN.has(ch)){ out += ch; continue; }
    if (code < 0x20 || code === 0x7F) continue;
    if (bad) bad.add(ch);
  }
  return out.replace(/ {2,}/g, ' ').trim();
}
const joinNE = (sep, ...parts) => parts.filter(Boolean).join(sep);
const lines = s => String(s || '').split(/\n+/);

const digits = s => String(s || '').replace(/\D/g, '');
const fmtPhone = s => { const d = digits(s), t = String(s || '').trim(); if (/[a-z]/i.test(t)) return t; const n = d.length === 11 && d[0] === '1' ? d.slice(1) : d; return n.length === 10 ? '(' + n.slice(0, 3) + ') ' + n.slice(3, 6) + '-' + n.slice(6) : t; };
const words = s => (String(s || '').trim().match(/\S+/g) || []).length;

/* ---------- field logic ---------- */
const jobEmpty = j => !(j.title.trim() || j.employer.trim() || j.startY || j.hours.trim() || j.bullets.some(b => b.trim()));
const degreeOf = e => e.degreeSel === 'other' ? e.degree.trim() : (e.degreeSel || '');
const eduEmpty = e => !(e.school.trim() || degreeOf(e) || e.major.trim() || e.compY);
function seriesGrade(j){
  let ser = j.series.trim(); if (/^\d{3}$/.test(ser)) ser = '0' + ser;
  const pp = (j.payPlan === 'other' ? j.payPlanOther : j.payPlan).trim().toUpperCase();
  return joinNE('-', pp, ser, j.grade.trim().toUpperCase());
}
function jobProblems(j){
  const p = [];
  if (!j.title.trim()) p.push('add the job title');
  if (!j.employer.trim()) p.push(j.kind === 'military' ? 'add the branch and unit' : 'add the employer');
  const hasStart = j.startM && j.startY, hasEnd = j.endM && j.endY;
  if (!hasStart) p.push('add the start month and year');
  if (!j.current && !hasEnd) p.push('add the end month and year, or check "I still work here"');
  if (hasStart && ym(j.startM, j.startY) > NOW_YM) p.push('the start date is in the future');
  if (hasStart && hasEnd && !j.current && ym(j.endM, j.endY) < ym(j.startM, j.startY)) p.push('the end date is before the start date');
  if (hasEnd && !j.current && ym(j.endM, j.endY) > NOW_YM) p.push('the end date is in the future (check "I still work here" instead)');
  const h = j.hours.trim();
  if (!h) p.push('add hours per week');
  else if (!/^\d{1,3}(\.\d+)?$/.test(h) || +h < 1 || +h > 168) p.push('hours per week should be a number from 1 to 168');
  if (j.kind === 'federal'){
    const pp = (j.payPlan === 'other' ? j.payPlanOther : j.payPlan).trim().toUpperCase();
    if (!/^[A-Z]{2}$/.test(pp)) p.push(j.payPlan === 'other' ? 'type the 2-letter pay plan' : 'choose the pay plan (for example GS)');
    if (!/^\d{3,4}$/.test(j.series.trim())) p.push('add the 4-digit series (for example 0861)');
    if (pp !== 'ES' && pp !== 'AD' && !/^(\d{1,2}|[IVX]{1,4})$/i.test(j.grade.trim())) p.push('choose the grade (for example 12)');
  }
  if (!j.bullets.some(b => b.trim())) p.push('add at least one accomplishment');
  return p;
}
function eduProblems(e){
  const p = [];
  if (!e.school.trim()) p.push('add the school name');
  if (!degreeOf(e)) p.push(e.degreeSel === 'other' ? 'type the degree name' : 'choose the degree type');
  const has = e.compM && e.compY;
  if (!has) p.push('add the completion month and year');
  if (has && !e.expected && ym(e.compM, e.compY) > NOW_YM) p.push('the completion date is in the future (check "Not finished yet")');
  const g = e.gpa.trim();
  if (g){
    const sc = parseFloat(e.gpaScale) || 4;
    if (!/^\d(\.\d{1,3})?$/.test(g) || +g > sc) p.push('check the GPA (a number like 3.6, no higher than the scale)');
  }
  return p;
}
function cmpJobs(a, b){
  const end = j => j.current ? Infinity : (j.endM && j.endY ? ym(j.endM, j.endY) : -Infinity);
  const st = j => j.startM && j.startY ? ym(j.startM, j.startY) : -Infinity;
  return (end(b) - end(a)) || (st(b) - st(a));
}
function fmtSalary(s){
  const n = parseFloat(String(s).replace(/[$,\s]/g, ''));
  if (!isFinite(n) || !/^\$?\s*[\d,]+(\.\d+)?$/.test(String(s).trim())) return s;
  return '$' + n.toLocaleString('en-US', {maximumFractionDigits: 2});
}

/* ---------- official wording from plain-language choices ---------- */
function vetText(c, C){ if (c.vetCode === 'legacy') return C(c.vet); const v = VET[c.vetCode]; return v ? v.print : ''; }
function clearanceText(c, C){
  const lvl = c.clLevel === 'other' ? C(c.clearance) : (CL_LEVEL[c.clLevel] || '');
  if (!lvl) return '';
  const bits = [CL_STATUS[c.clStatus], (c.clLevel === 'ts' || c.clLevel === 'tssci') ? CL_POLY[c.clPoly] : ''].filter(Boolean);
  const tail = bits.length ? ' (' + bits.join(', ') + ')' : '';
  return (/^pt/.test(c.clLevel) ? 'Public trust: ' : 'Security clearance: ') + lvl + tail;
}
function fedText(c, C){
  const parts = [];
  if (c.fedEmp === 'current' || c.fedEmp === 'former'){
    let t = c.fedEmp === 'current' ? 'Current federal employee' : 'Former federal employee';
    if (TENURE[c.fedTenure]) t += ' (' + TENURE[c.fedTenure] + ')';
    const g = C(c.fedGrade); if (g) t += (c.fedEmp === 'current' ? ', ' : ', highest grade held ') + g;
    parts.push(t);
  }
  PATHS.forEach(x => { if (c[x[0]]) parts.push(x[2]); });
  const o = C(c.status); if (o) parts.push(o);
  return parts.join(' | ');
}
function langText(st, C){ return st.langs.filter(l => C(l.name)).map(l => C(l.name) + (LANG_PRINT[l.level] ? ' (' + LANG_PRINT[l.level] + ' proficiency)' : '')).join('; '); }
function availText(a){
  const parts = [];
  if (a.schedule) parts.push({full:'available for full-time work', part:'available for part-time work', either:'available for full-time or part-time work'}[a.schedule] || '');
  if (a.relocate === 'yes') parts.push('willing to relocate');
  if (a.travel) parts.push({'25':'willing to travel up to 25% of the time', '50':'willing to travel up to 50% of the time', '75':'willing to travel 75% of the time or more'}[a.travel] || '');
  const t = parts.filter(Boolean).join('; ');
  return t ? t.charAt(0).toUpperCase() + t.slice(1) + '.' : '';
}

/* ---------- content model (shared by PDF, preview, and text) ---------- */
function model(st, C){
  const c = st.contact, t = st.target;
  const head = {name: C(c.name), lines: []};
  head.lines.push(joinNE(' | ', joinNE(', ', C(c.city), C(stateOut(c.state))), C(c.email), C(fmtPhone(c.phone))));
  const vt = vetText(c, C);
  head.lines.push(joinNE(' | ', c.citizen === 'yes' ? 'U.S. Citizen' : '', vt ? "Veterans' preference: " + vt : '', clearanceText(c, C)));
  head.lines.push(fedText(c, C));
  const tp = joinNE(', ', C(t.title), C(t.seriesGrade)), an = C(t.announcement);
  if (tp || an) head.lines.push('Applying for: ' + joinNE(' | ', tp, an ? 'Announcement ' + an : ''));
  head.lines = head.lines.filter(Boolean);

  const secs = [];
  const sum = paras(st.summary).map(C).filter(Boolean);
  if (sum.length) secs.push({title:'Summary', items: sum.map(text => ({k:'para', text}))});

  const exp = {title:'Work Experience', items: st.jobs.filter(j => !jobEmpty(j)).map(j => {
    let title = C(j.title) || 'Job title';
    if (j.kind === 'military' && C(j.rank)) title += ' (' + C(j.rank) + ')';
    if (j.kind === 'federal' && seriesGrade(j)) title += ', ' + seriesGrade(j);
    if (j.kind === 'volunteer' && !/volunteer/i.test(title)) title += ' (Volunteer)';
    const emp = joinNE(', ', C(j.employer), C(j.city), C(stateOut(j.state)));
    const start = j.startM && j.startY ? j.startM + '/' + j.startY : '';
    const end = j.current ? 'Present' : (j.endM && j.endY ? j.endM + '/' + j.endY : '');
    const dates = start || end ? joinNE(' – ', start, end) : '';
    const hrs = C(j.hours) ? C(j.hours) + ' hours per week' : '';
    const sal = C(j.salary) ? 'Salary: ' + fmtSalary(C(j.salary)) + ' ' + j.salaryBasis : '';
    const contact = {yes:'; may contact', ask:'; contact me first', no:'; do not contact'}[j.supContact] || '';
    const sup = C(j.supName) ? 'Supervisor: ' + joinNE(', ', C(j.supName), C(fmtPhone(j.supPhone))) + contact : '';
    return {k:'entry', title, lines:[emp, joinNE(' | ', dates, hrs, sal), sup].filter(Boolean), bullets: j.bullets.map(b => bulletText(C(b))).filter(Boolean)};
  })};
  const edu = {title:'Education', items: st.edu.filter(e => !eduEmpty(e)).map(e => {
    const deg = joinNE(', ', C(degreeOf(e)), C(e.major)) || 'Degree';
    const when = e.compM && e.compY ? (e.expected ? 'Expected ' : 'Completed ') + e.compM + '/' + e.compY : '';
    const gpa = C(e.gpa) ? 'GPA ' + C(e.gpa) + (C(e.gpaScale) ? '/' + C(e.gpaScale) : '') : '';
    const meta = joinNE(' | ', joinNE(', ', C(e.school), C(e.city), C(stateOut(e.state))), when, gpa);
    return {k:'entry', title:deg, lines:[meta, C(e.coursework) ? 'Relevant coursework: ' + C(e.coursework) : ''].filter(Boolean), bullets:[]};
  })};
  const order = st.opts.eduFirst ? [edu, exp] : [exp, edu];
  order.forEach(s => { if (s.items.length) secs.push(s); });

  const certs = st.certs.filter(x => C(x.name)).map(x => {
    const d = joinNE('; ', x.issM && x.issY ? 'issued ' + x.issM + '/' + x.issY : '', x.expM && x.expY ? 'expires ' + x.expM + '/' + x.expY : '');
    return {k:'bullet', text: joinNE(', ', C(x.name), C(x.issuer)) + (d ? ' (' + d + ')' : '')};
  });
  if (certs.length) secs.push({title:'Certifications and Licenses', items: certs});
  const tr = st.training.filter(x => C(x.name)).map(x => {
    const d = joinNE('; ', x.compM && x.compY ? 'completed ' + x.compM + '/' + x.compY : '', C(x.hours) ? C(x.hours) + ' hours' : '');
    return {k:'bullet', text: joinNE(', ', C(x.name), C(x.provider)) + (d ? ' (' + d + ')' : '')};
  });
  if (tr.length) secs.push({title:'Training', items: tr});
  const listSec = (title, src, k) => { const it = lines(src).map(C).filter(Boolean).map(text => ({k, text})); if (it.length) secs.push({title, items: it}); };
  listSec('Skills', st.skills, 'para');
  const lt = langText(st, C); if (lt) secs.push({title:'Languages', items:[{k:'para', text:lt}]});
  listSec('Awards and Honors', st.awards, 'bullet');
  listSec('Publications and Presentations', st.pubs, 'bullet');
  const av = availText(st.avail);
  const add = (av ? [av] : []).concat(paras(st.additional).map(C).filter(Boolean));
  if (add.length) secs.push({title:'Additional Information', items: add.map(text => ({k:'para', text}))});
  return {head, secs};
}

/* ---------- measuring + layout (exact page count; PDF and preview use the same ops) ---------- */
const JS = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : null;
let mdoc = null, ctx2d = null;
if (JS){ try { mdoc = new JS({unit:'pt', format:'letter'}); } catch (e) { mdoc = null; } }
const mcache = new Map();
function measure(str, size, bold){
  const key = (bold ? 'b' : 'n') + size + '|' + str;
  let w = mcache.get(key);
  if (w !== undefined) return w;
  if (mdoc){ mdoc.setFont('helvetica', bold ? 'bold' : 'normal'); w = mdoc.getStringUnitWidth(str) * size; }
  else {
    if (!ctx2d) ctx2d = document.createElement('canvas').getContext('2d');
    ctx2d.font = (bold ? '700 ' : '400 ') + size + 'px Helvetica, Arial, sans-serif';
    w = ctx2d.measureText(str).width;
  }
  if (mcache.size > 20000) mcache.clear();
  mcache.set(key, w);

function wrap(str, size, bold, maxW){

    if (line){ out.push(line); line = ''; }

    let chunk = '';
    for (const ch of w){

    }

  }

}
const PW = 612, PH = 792, M = 36, CW = PW - 2 * M, FOOT = 14, BOT = PH - M - FOOT;
const SZ = {name:14, head:11, body:10, foot:8};
const LD = {name:18, head:14, body:12.5};

function layout(st){
  const bad = new Set();
  const C = s => clean(s, bad);
  const mdl = model(st, C);
  const pages = [[]];
  let ops = pages[0], y = M;
  const newPage = () => { ops = []; pages.push(ops); y = M; };
  const room = h => { if (y + h > BOT + 0.01 && y > M) newPage(); };
  const put = (str, x, size, bold, lead) => { const w = measure(str, size, bold); ops.push({t:'text', str, x, y: y + (lead - size) / 2 + size * 0.8, size, bold, w}); };
  const para = (text, o) => {
    o = o || {}; const x = o.x || M, w = o.w || CW, size = o.size || SZ.body, bold = !!o.bold, lead = o.lead || LD.body;
    const ls = wrap(text, size, bold, w); if (!ls.length) return;
    if (ls.length <= (o.keep || 4)) room(ls.length * lead);
    for (const ln of ls){ room(lead); put(ln, x, size, bold, lead); y += lead; }
  };
  const bullet = text => {
    const bx = M + 3, tx = M + 13, w = CW - 13;
    const ls = wrap(text, SZ.body, false, w); if (!ls.length) return;
    if (ls.length <= 4) room(ls.length * LD.body);
    ls.forEach((ln, i) => { room(LD.body); if (i === 0) put('•', bx, SZ.body, false, LD.body); put(ln, tx, SZ.body, false, LD.body); y += LD.body; });
    y += 1.5;
  };
  const heading = (title, after) => {
    room(6 + LD.head + 5 + (after || LD.body * 2));
    if (y > M) y += 6;
    put(title, M, SZ.head, true, LD.head); y += LD.head;
    ops.push({t:'line', x1:M, y1:y, x2:M + CW, y2:y, w:0.6});
    y += 5;
  };
  const nlines = (s, bold) => wrap(s, SZ.body, bold, CW).length;

  const name = mdl.head.name || 'Your Name';
  put(name, M, SZ.name, true, LD.name); y += LD.name;
  mdl.head.lines.forEach(l => para(l));
  y += 2;

  mdl.secs.forEach(sec => {
    const first = sec.items[0];
    let after = LD.body * 2;
    if (first && first.k === 'entry') after = (nlines(first.title, true) + first.lines.reduce((a, l) => a + nlines(l, false), 0) + (first.bullets.length ? 1 : 0)) * LD.body;
    heading(sec.title, after);
    sec.items.forEach((it, i) => {
      if (it.k === 'entry'){
        if (i > 0) y += 7;
        const hl = nlines(it.title, true) + it.lines.reduce((a, l) => a + nlines(l, false), 0);
        room((hl + (it.bullets.length ? 1 : 0)) * LD.body + 2);
        para(it.title, {bold:true});
        it.lines.forEach(l => para(l));
        if (it.bullets.length){ y += 2; it.bullets.forEach(bullet); }
      } else if (it.k === 'para'){
        if (i > 0) y += 3;
        para(it.text, {keep:6});
      } else bullet(it.text);
    });
  });

  const n = pages.length;
  const used = (n - 1) + Math.max(0, Math.min(1, (y - M) / (BOT - M)));
  if (n > 1) pages.forEach((p, i) => {
    const s = name + ', page ' + (i + 1) + ' of ' + n;
    const w = measure(s, SZ.foot, false);
    p.push({t:'text', str:s, x:M + CW - w, y:PH - M - 2, size:SZ.foot, bold:false, w});
  });
  return {pages, used, bad, mdl};
}

const STOP = new Set(('a about above across after again against all also am an and any are as at be because been before being below between both but by can could did do does doing done down during each either etc few for from further had has have having he her here hers him his how i if in into is it its itself just like may me might more most must my no nor not now of off on once only or other our out over own per same shall she should so some such than that the their them then there these they this those through to too under until up upon us very via was we were what when where which while who whom why will with within without would you your yours').split(' '));
const BOILER = new Set(('ability abilities able applicant applicants apply applying candidate candidates demonstrated demonstrate demonstrating duties duty equivalent example examples experience experiences federal following grade grades include includes including knowledge level levels minimum position positions qualification qualifications qualified qualify related required requirement requirements resume service skill skills specialized year years work works working perform performing performs performed responsible responsibilities typical typically using used use next lower higher time general basic least announcement order meet meets met documented describe described option options successfully one two three four five six seven specific well other various current provide provides providing must gained full-time part-time week weeks hours tools tool developing preparing ensuring ensure support supporting assist assisting area areas field fields type types multiple').split(' '));
const isAcr = w => /^[A-Z0-9+#&/-]{2,}$/.test(w) && /[A-Z]/.test(w);
function extractKeywords(text){
  if (!text || !text.trim()) return [];
  const uni = new Map(), bi = new Map(), seen = new Map(); let pos = 0;
  const norm = w => isAcr(w) ? w : w.toLowerCase();
  const ok = w => { const l = w.toLowerCase(); if (STOP.has(l) || BOILER.has(l) || /^\d+$/.test(w) || /^[A-Za-z]{2}-\d/.test(w)) return false; if (isAcr(w)) return !['GS','US','USA','OR','AND','NASA','OPM'].includes(w); return l.length >= 4; };
  for (const sent of text.split(/[.;:\n•()\[\]!?]+/)){
    const toks = sent.split(/[\s,"“”']+/).map(t => t.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9+#]+$/g, '')).filter(Boolean);
    for (let i = 0; i < toks.length; i++){
      const w = toks[i]; if (!ok(w)) continue;
      const k = norm(w); uni.set(k, (uni.get(k) || 0) + 1); if (!seen.has(k)) seen.set(k, pos++);
      if (i + 1 < toks.length && ok(toks[i + 1])){ const k2 = k + ' ' + norm(toks[i + 1]); bi.set(k2, (bi.get(k2) || 0) + 1); if (!seen.has(k2)) seen.set(k2, pos++); }
    }
  }
  const sorter = (a, b) => (b[1] - a[1]) || (seen.get(a[0]) - seen.get(b[0]));
  const bis = [...bi].filter(x => x[1] >= 2).sort(sorter).slice(0, 8).map(x => x[0]);
  const inBi = new Set(bis.flatMap(b => b.split(' ')));
  const unis = [...uni].filter(x => !inBi.has(x[0])).sort(sorter).slice(0, 20 - bis.length).map(x => x[0]);
  return bis.concat(unis);
}
function keywords(){
  const t = state.target, rem = new Set(t.kwRemoved.map(k => k.toLowerCase()));
  const out = [], seen = new Set();
  for (const k of t.kwAdded.concat(extractKeywords(t.reqText))){
    const l = k.toLowerCase(); if (seen.has(l) || rem.has(l)) continue; seen.add(l); out.push(k);
  }
  return out;
}
const SUFFIX = ['ations','ation','ments','ment','ings','ing','ions','ion','ities','ity','ies','ied','ers','er','ed','es','s','al','ly'];
function stem(w){ w = w.toLowerCase(); for (const s of SUFFIX){ if (w.endsWith(s) && w.length - s.length >= 4) return w.slice(0, -s.length); } return w; }
function resumeText(){
  const s = state, parts = [s.summary, s.skills, s.languages, s.awards, s.pubs, s.additional];
  s.jobs.forEach(j => parts.push(j.title, j.employer, ...j.bullets));
  s.edu.forEach(e => parts.push(e.degree, e.major, e.coursework));
  s.certs.forEach(c => parts.push(c.name, c.issuer));
  s.training.forEach(c => parts.push(c.name, c.provider));

}
function stemSet(){
  const toks = resumeText().split(/[^A-Za-z0-9+#]+/).filter(Boolean);

}
function hasKw(kw, stems){

const KNOWN_ACR = new Set('NASA USA US GS GPA PHD BS BA MS MA MBA AA AS AAS IT HR PDF USAJOBS DC II III IV VI VII VIII IX XI XII AM PM CEO STEM CPR DD SF ID TX FL CA VA MD AL OH NY'.split(' '));
let lastL = null, lastChecks = {req:[], adv:[], go:false};
function runChecks(L){
  const s = state, req = [], adv = [];
  const c = s.contact, cm = [];
  if (!c.name.trim()) cm.push('Add your full name.');
  if (!c.email.trim()) cm.push('Add your email address.');
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email.trim())) cm.push('Check the email address. It should look like name@example.com.');
  if (!c.phone.trim()) cm.push('Add your phone number.');
  else if (digits(c.phone).length < 10) cm.push('Check the phone number. It needs at least 10 digits.');
  if (c.clLevel === 'other' && !c.clearance.trim()) cm.push('Type your clearance, or choose \u201cNo clearance.\u201d');
  if (c.clLevel && !c.clStatus) cm.push('Choose your clearance status.');
  req.push({label:'Contact and header details', ok:!cm.length, details:cm, step:1});

  const jobs = s.jobs.filter(j => !jobEmpty(j)), em = [];
  if (!jobs.length) em.push('Add at least one job, volunteer role, or military service.');
  s.jobs.forEach((j, i) => { if (jobEmpty(j)) return; const nm = j.title.trim() || 'Job ' + (i + 1); jobProblems(j).forEach(p => em.push(nm + ': ' + p + '.')); });
  req.push({label:'Work experience details', ok:!em.length, details:em, step:3});

  const eds = s.edu.filter(e => !eduEmpty(e)), edm = [];
  s.edu.forEach((e, i) => { if (eduEmpty(e)) return; const nm = e.school.trim() || 'School ' + (i + 1); eduProblems(e).forEach(p => edm.push(nm + ': ' + p + '.')); });
  req.push({label:'Education details', ok:!edm.length, details:edm, step:4});

  const crm = [];
  s.certs.forEach((x, i) => { if (!x.name.trim() && (x.issuer.trim() || x.issY || x.expY)) crm.push('Certification ' + (i + 1) + ': add its name.'); });
  s.training.forEach((x, i) => { if (!x.name.trim() && (x.provider.trim() || x.compY || x.hours.trim())) crm.push('Training ' + (i + 1) + ': add its name.'); if (x.hours.trim() && !/^\d+(\.\d+)?$/.test(x.hours.trim())) crm.push((x.name.trim() || 'Training ' + (i + 1)) + ': hours should be a number.'); });
  const lm = [];
  s.langs.forEach((l, i) => { if (l.name.trim() && !l.level) lm.push(l.name.trim() + ': choose how well you know it.'); if (!l.name.trim() && l.level) lm.push('Language ' + (i + 1) + ': add the language name.'); });
  if (s.langs.length) req.push({label:'Languages', ok:!lm.length, details:lm, step:6});
  if (s.certs.length || s.training.length) req.push({label:'Certifications and training', ok:!crm.length, details:crm, step:5});

  const n = L.pages.length;
  req.push({label:'Two-page limit', ok: n <= 2, details: n <= 2 ? [] : ['Your resume runs ' + fmtPages(L) + ' pages. Cut or tighten lines until the meter shows 2.0 or less. Older or unrelated jobs and extra lines are the first things to trim.'], step: n <= 2 ? null : 3});

    adv.push({label:'Unprintable characters', details:['These characters can\u2019t print in a standard PDF, so they were left out: ' + (shown || '(invisible characters)') + '. Replace them with plain text.'], step:null});

}

function wordDiff(a, b){
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length;
  if (n * m > 160000) return {a: esc(a), b: esc(b)};
  const T = Array.from({length:n + 1}, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) T[i][j] = A[i] === B[j] ? T[i + 1][j + 1] + 1 : Math.max(T[i + 1][j], T[i][j + 1]);
  let i = 0, j = 0, oa = '', ob = '';
  while (i < n && j < m){
    if (A[i] === B[j]){ oa += esc(A[i]); ob += esc(B[j]); i++; j++; }
    else if (T[i + 1][j] >= T[i][j + 1]){ oa += /\S/.test(A[i]) ? '<del>' + esc(A[i]) + '</del>' : esc(A[i]); i++; }
    else { ob += /\S/.test(B[j]) ? '<ins>' + esc(B[j]) + '</ins>' : esc(B[j]); j++; }
  }
  while (i < n){ oa += /\S/.test(A[i]) ? '<del>' + esc(A[i]) + '</del>' : esc(A[i]); i++; }
  while (j < m){ ob += /\S/.test(B[j]) ? '<ins>' + esc(B[j]) + '</ins>' : esc(B[j]); j++; }
  return {a: oa, b: ob};
}

  const p = ui.proof; let body;
  if (!p) body = '<button type="button" class="btn quiet" data-act="proofread">Check spelling and grammar</button>';
  else if (p.status === 'running') body = '<p class="hint" role="status">Checking your summary and lines…</p>';
  else if (p.status === 'error') body = '<p class="hint">' + esc(p.msg) + '</p>' + (p.retry ? '<button type="button" class="btn quiet small" data-act="proofread">Try again</button>' : '');
  else {
    const left = p.fixes.filter(f => !f.done);
    body = left.length ? left.map(f => { const d = wordDiff(f.orig, f.fixed); return '<div class="fix"><p>' + d.a + '</p><p>' + d.b + '</p>' + (f.why ? '<p class="why">' + esc(f.why) + '</p>' : '') + '<div class="btnrow"><button type="button" class="btn quiet small" data-act="acceptFix" data-arg="' + f.i + '">Use this fix</button><button type="button" class="btn quiet small" data-act="dismissFix" data-arg="' + f.i + '">Keep mine</button></div></div>'; }).join('')
      : '<p class="hint good">' + (p.fixes.length ? 'All suggestions handled.' : 'No spelling or grammar problems found.') + '</p>';
    body += '<button type="button" class="btn quiet small" data-act="proofread">Check again</button>';
  }
  return '<section class="block"><h3>Proofread</h3><p class="hint">Flags spelling, grammar, and punctuation only, and never adds content, which fits NASA\u2019s rule that AI may help with grammar and style. You approve each change.</p>' + body + '</section>';
}
function plainText(mdl){
  const out = [(mdl.head.name || 'Your Name').toUpperCase()].concat(mdl.head.lines);
  mdl.secs.forEach(s => {
    out.push('', s.title.toUpperCase());
    s.items.forEach((it, i) => {
      if (it.k === 'entry'){ if (i) out.push(''); out.push(it.title, ...it.lines, ...it.bullets.map(b => '• ' + b)); }
      else if (it.k === 'para') out.push(it.text);
      else out.push('• ' + it.text);
    });
  });
  return out.join('\n');
}

function autogrow(el){ if (!el.offsetParent) return; el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }

/* ---------- actions ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('show'), 2600); }
function focusSoon(selector){ requestAnimationFrame(() => { const el = $(selector); if (el){ el.focus(); if (el.scrollIntoView) el.scrollIntoView({block:'center'}); } }); }
function armed(btn, fn){
  if (btn.dataset.armed === '1'){ fn(); return; }
  const orig = btn.textContent; btn.dataset.armed = '1'; btn.textContent = 'Tap again to confirm';
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed === '1'){ btn.dataset.armed = ''; btn.textContent = orig; } }, 3500);
}
function moveIn(arr, id, dir){ const i = arr.findIndex(x => x.id === id), t = i + dir; if (i < 0 || t < 0 || t >= arr.length) return false; const tmp = arr[i]; arr[i] = arr[t]; arr[t] = tmp; return true; }
const findJob = id => state.jobs.find(j => j.id === id);
function go(n){

function lastName(){ const parts = clean(state.contact.name).split(' ').filter(p => !/^(jr\.?|sr\.?|ii|iii|iv)$/i.test(p)); return parts.length ? parts[parts.length - 1] : 'Resume'; }
const safeName = s => clean(s).replace(/[^A-Za-z0-9-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);

async function saveFile(filename, data){

  if (!dl){ toast(dlState === 'pending' ? 'Getting ready. Try again in a moment.' : 'Saving files isn\u2019t available in this view.'); return; }
  try { const r = await dl.save({filename, data}); if (!r || r.status === 'saved') toast('Saved ' + filename); }
  catch (e) {
    const code = e && e.code;
    if (code === 'declined') toast('Download canceled.');
    else if (code === 'rate_limited') toast('A save prompt is already open.');

  }

function buildPdf(L){
  const doc = new JS({unit:'pt', format:'letter', compress:true, putOnlyUsedFonts:true});
  const nm = clean(state.contact.name);
  doc.setProperties({title: nm ? nm + ' - Federal Resume' : 'Federal Resume', author: nm, subject: joinNE(' ', clean(state.target.title), clean(state.target.announcement)), creator: 'Federal resume builder'});
  doc.setTextColor(0, 0, 0); doc.setDrawColor(0, 0, 0);
  L.pages.forEach((ops, i) => {
    if (i) doc.addPage('letter', 'portrait');
    for (const op of ops){
      if (op.t === 'text'){ doc.setFont('helvetica', op.bold ? 'bold' : 'normal'); doc.setFontSize(op.size); doc.text(op.str, op.x, op.y); }
      else { doc.setLineWidth(op.w); doc.line(op.x1, op.y1, op.x2, op.y2); }
    }
  });
  return doc.output('arraybuffer');
}
async function copyText(text, btn){

  if (!ok){
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
  }
  const orig = btn.textContent; btn.textContent = ok ? 'Copied' : 'Select the text and copy it';
  setTimeout(() => { if (btn.isConnected) btn.textContent = orig; }, 2200);
}
async function proofread(){
  if (!sampler) return;
  const items = [];
  if (state.summary.trim()) items.push({id:'summary', text: state.summary.trim()});
  state.jobs.forEach(j => j.bullets.forEach((b, k) => { if (b.trim()) items.push({id:'b:' + j.id + ':' + k, text: b.trim()}); }));
  if (!items.length){ ui.proof = {status:'error', msg:'Write your summary or some accomplishment lines first.', retry:false}; renderStep(); return; }
  ui.proof = {status:'running'}; renderStep();
  const prompt = 'You are a careful proofreader for a U.S. federal resume. For each item, fix ONLY spelling, grammar, punctuation, capitalization, and verb agreement or tense errors.\n'
    + 'Rules:\n- Never add, remove, or change facts, numbers, names, tools, titles, or claims.\n- Do not rewrite for style, tone, or length. Keep the writer\u2019s words unless a word is misspelled or grammatically wrong.\n- Use U.S. English.\n- Skip items that have no errors.\n'
    + 'Return only a JSON array. Each element: {"id": string, "fixed": string, "why": string of at most 10 words}. Return [] if nothing needs fixing.\n\nItems:\n' + JSON.stringify(items);
  try {
    const res = await sampler.json(prompt, {modelTier:'default'});
    const byId = new Map(items.map(x => [x.id, x.text]));
    const fixes = (Array.isArray(res) ? res : []).filter(f => f && typeof f.id === 'string' && typeof f.fixed === 'string' && byId.has(f.id)).map(f => ({id:f.id, orig:byId.get(f.id), fixed:f.fixed.trim(), why: typeof f.why === 'string' ? f.why.slice(0, 120) : ''}))
      .filter(f => f.fixed && f.fixed !== f.orig && digits(f.fixed) === digits(f.orig) && f.fixed.length > f.orig.length * 0.6 && f.fixed.length < f.orig.length * 1.4)
      .map((f, i) => Object.assign(f, {i, done:false}));
    ui.proof = {status:'done', fixes};
  } catch (e) {
    const code = e && e.code;
    ui.proof = {status:'error', retry: code !== 'not_granted', msg: code === 'rate_limited' ? 'Too many checks in a short time. Wait a minute and try again.' : code === 'not_granted' ? 'Proofreading wasn\u2019t allowed in this view.' : 'The check didn\u2019t finish. Try again.'};
    if (code === 'not_granted') spState = 'none';
  }
  if (state.step === REVIEW) renderStep();
}

  addLang: () => { state.langs.push(blankLang()); changed(); renderStep(); focusSoon('#' + fid('langs.' + (state.langs.length - 1) + '.name')); },
